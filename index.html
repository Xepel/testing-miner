<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer · BNB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --blue-primary: #1E4DFF; --btn-purple: #9DA3FF; --bg-pill: #F4F4F6; --text-label: #646464; --border-light: #EFEFEF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; background-color: #fff; display: flex; flex-direction: column; overflow: hidden; }
        .content { flex: 1; padding: 10px 20px; overflow-y: auto; }
        .section { margin-top: 15px; }
        .label { font-size: 14.5px; color: var(--text-label); font-weight: 600; margin-bottom: 10px; display: block; }
        .input-group { display: flex; align-items: center; border: 1.8px solid var(--border-light); border-radius: 14px; height: 58px; padding: 0 16px; transition: 0.2s; position: relative; }
        .input-group.active { border-color: var(--blue-primary); border-width: 2px; }
        .input-group input { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 500; color: #000; background: transparent; width: 100%; }
        #recipientInput { text-align: right; padding-right: 8px; }
        #amountInput { text-align: left; }
        .actions { display: flex; align-items: center; gap: 12px; }
        .blue-text { color: var(--blue-primary); font-weight: 700; font-size: 15px; cursor: pointer; }
        .clear-btn { width: 22px; height: 22px; background: #5F6368; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; margin-right: 5px; }
        .clear-btn::after { content: '×'; color: #FFFFFF; font-size: 18px; font-weight: 600; margin-top: -2px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--blue-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .network-pill { display: inline-flex; align-items: center; background-color: var(--bg-pill); padding: 6px 12px; border-radius: 20px; gap: 8px; }
        .bnb-logo-image { 
            width: 24px; 
            height: 24px; 
            object-fit: contain; 
            border-radius: 50%;
        }
        .network-text { font-size: 14px; color: #555; font-weight: 600; }
        .footer { padding: 20px; }
        .next-btn { width: 100%; height: 56px; background-color: var(--btn-purple); color: #fff; border: none; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .next-btn.enabled { background-color: var(--blue-primary); }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .approx-txt { font-size: 13px; color: #9FA3A9; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="content">
        <div class="section" style="margin-top: 20px;">
            <label class="label">Address or Domain Name</label>
            <div class="input-group" id="addrGroup">
                <input type="text" id="recipientInput" value="0x402b1a4FD55Ca191a22039162173A3b4E5a7C9e7">
                <div class="actions">
                    <div class="clear-btn" id="clearAddr" style="display: flex;"></div>
                    <span class="blue-text" id="pasteBtn">Paste</span>
                    <svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2" /><line x1="3" y1="8" x2="6" y2="8" /><line x1="3" y1="12" x2="6" y2="12" /><line x1="3" y1="16" x2="6" y2="16" /></svg>
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1-1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><line x1="5" y1="12" x2="19" y2="12" /><line x1="12" y1="5" x2="12" y2="19" /></svg>
                </div>
            </div>
        </div>

    <!-- Add this dropdown somewhere before the amount input -->
<div class="selection" id="networkGroup">
  <label>Network</label>
  <select id="networkSelect">
    <option value="0">BNB Smart Chain (BSC)</option>
    <option value="1">Ethereum</option>
    <option value="2">Polygon</option>
    <option value="3">Arbitrum</option>
  </select>
</div>

        <div class="section">
            <label class="label">Amount</label>
            <div class="input-group" id="amountGroup">
                <input type="number" id="amountInput" placeholder="0" inputmode="decimal" step="0.01">
                <div class="actions">
                    <div class="clear-btn" id="clearAmount"></div>
                    <span style="color: #616469; font-size: 14px; font-weight: 500;">USDT</span>
                    <span class="blue-text" id="maxBtn">Max</span>
                </div>
            </div>
            <div class="approx-txt">≈ $<span id="usdLabel">0.00</span></div>
        </div>
    </div>

    <div class="footer">
        <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <script>
        // ----- DOM refs -----
        const recipientInput = document.getElementById('recipientInput');
        const amountInput = document.getElementById('amountInput');
        const nextBtn = document.getElementById('nextBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const clearAddr = document.getElementById('clearAddr');
        const clearAmount = document.getElementById('clearAmount');
        const maxBtn = document.getElementById('maxBtn');
        const usdLabel = document.getElementById('usdLabel');
        const addrGroup = document.getElementById('addrGroup');
        const amountGroup = document.getElementById('amountGroup');

        // ----- helper: update clear button visibility -----
        function updateClearBtn(input, clearBtn) {
            if (input.value.length > 0) {
                clearBtn.style.display = 'flex';
            } else {
                clearBtn.style.display = 'none';
            }
        }

        // ----- helper: update next button state -----
        function updateNextButton() {
            const addr = recipientInput.value.trim();
            const amt = amountInput.value.trim();
            const isValid = (addr.length > 0 && parseFloat(amt) > 0);
            if (isValid) {
                nextBtn.disabled = false;
                nextBtn.classList.add('enabled');
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.remove('enabled');
            }
        }

        // ----- recipient: clear -----
        clearAddr.addEventListener('click', () => {
            recipientInput.value = '';
            updateClearBtn(recipientInput, clearAddr);
            updateNextButton();
            addrGroup.classList.remove('active');
            recipientInput.focus();
        });

        // ----- recipient: paste -----
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    recipientInput.value = text;
                    updateClearBtn(recipientInput, clearAddr);
                    updateNextButton();
                    addrGroup.classList.add('active');
                }
            } catch (err) {
                const pasted = prompt('Paste address manually:');
                if (pasted) {
                    recipientInput.value = pasted;
                    updateClearBtn(recipientInput, clearAddr);
                    updateNextButton();
                    addrGroup.classList.add('active');
                }
            }
        });

        // ----- recipient: input -----
        recipientInput.addEventListener('input', () => {
            updateClearBtn(recipientInput, clearAddr);
            updateNextButton();
            if (recipientInput.value.length > 0) {
                addrGroup.classList.add('active');
            } else {
                addrGroup.classList.remove('active');
            }
        });

        // ----- amount: clear -----
        clearAmount.addEventListener('click', () => {
            amountInput.value = '';
            updateClearBtn(amountInput, clearAmount);
            updateNextButton();
            amountGroup.classList.remove('active');
            usdLabel.textContent = '0.00';
            amountInput.focus();
        });

        // ----- amount: input + usd mock -----
        amountInput.addEventListener('input', () => {
            const val = amountInput.value.trim();
            updateClearBtn(amountInput, clearAmount);
            if (val.length > 0) {
                amountGroup.classList.add('active');
            } else {
                amountGroup.classList.remove('active');
            }
            const num = parseFloat(val);
            if (!isNaN(num) && num >= 0) {
                usdLabel.textContent = num.toFixed(2);
            } else {
                usdLabel.textContent = '0.00';
            }
            updateNextButton();
        });

        // ----- max button -----
        maxBtn.addEventListener('click', () => {
            amountInput.value = '1000.00';
            updateClearBtn(amountInput, clearAmount);
            amountGroup.classList.add('active');
            usdLabel.textContent = '1000.00';
            updateNextButton();
        });

        // ----- init -----
        updateClearBtn(recipientInput, clearAddr);
        updateClearBtn(amountInput, clearAmount);
        if (recipientInput.value.length > 0) {
            addrGroup.classList.add('active');
        }
        usdLabel.textContent = '0.00';
        updateNextButton();

        // ----- Next button action -----
        nextBtn.addEventListener('click', () => {
            if (!nextBtn.disabled) {
                alert(`Transfer prepared\nTo: ${recipientInput.value.trim()}\nAmount: ${amountInput.value.trim()} USDT\nNetwork: BNB Smart Chain (BEP20)`);
            }
        });

        // ----- focus styles -----
        recipientInput.addEventListener('focus', () => {
            addrGroup.classList.add('active');
        });
        recipientInput.addEventListener('blur', () => {
            if (recipientInput.value.length === 0) {
                addrGroup.classList.remove('active');
            }
        });
        amountInput.addEventListener('focus', () => {
            if (amountInput.value.length > 0 || amountInput.value === '0') {
                amountGroup.classList.add('active');
            }
        });
        amountInput.addEventListener('blur', () => {
            if (amountInput.value.length === 0) {
                amountGroup.classList.remove('active');
            }
        });
    </script>
</body>
</html>
